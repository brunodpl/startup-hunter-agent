[project]
name = "startup-hunter-agent"
version = "1.0.0"
description = "Evidence-first company discovery pipeline with a narrow agent boundary and durable delivery state."
requires-python = ">=3.11,<3.14"
dependencies = [
    "apify-client>=3.0.2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["startup_hunter"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# Descubre solo los tests de este proyecto y evita recorrer repositorios vecinos.
testpaths = ["tests"]
